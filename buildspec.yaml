 version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - npm install

  pre_build:
    commands:
      - echo "Pre-build phase started"

  build:
    commands:
      - echo "Building Node.js application"
      - echo "Running application checks"
      - node --check server.js
      - node --check app.js

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - '**/*'
  discard-paths: no
  exclude-paths:
    - node_modules/**/*
    - .git/**/*

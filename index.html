<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS CodeCommit Deployment</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: yellow;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 480px;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.4rem 0.8rem;
      background-color: #0284c7;
      color: #ffffff;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Congratulations! Deployment Successful</h1>
    <p>This page is hosted from an <strong>AWS CodeCommit</strong> repository.</p>
    <div class="badge">Version 1.0</div>
  </div>
</body>
</html>
